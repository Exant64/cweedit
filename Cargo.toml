[package]
name = "cweedit"
version = "1.0.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytemuck = "1.22.0"
byteorder = "1.5.0"
ddsfile = "0.5.2"
eframe = { version = "0.31.1", features = ["wgpu"] }
egui = "0.31.1"
egui-wgpu = "0.31.1"
env_logger = "0.11.7"
gctex = "0.3.12"
glam = "0.30.1"
hex_color = "3.0.0"
image = "0.25.6"
pollster = "0.4.0"
rand = "0.9.2"
rfd = "0.15.3"
self_update = "0.42.0"
serde = "1.0.219"
serde_json = "1.0.140"
twox-hash = "2.1.1"
wgpu = "24.0.3"
zerocopy = {version = "0.8.24", features=["derive"]}
